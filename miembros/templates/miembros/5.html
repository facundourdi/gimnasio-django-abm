{% extends 'miembros/base.html' %}
{% block content %}
<h2>Confirmar Eliminación</h2>
<p>¿Seguro que deseas dar de baja a <strong>{{ miembro.nombre }}</strong>?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
    <a href="{% url 'listar_miembros' %}">Cancelar</a>
</form>
{% endblock %}
