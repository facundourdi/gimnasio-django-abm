{% extends 'miembros/base.html' %}
{% block content %}
<h2>Editar Miembro</h2>
<form method="POST">
    {% csrf_token %}
    <p><label>Nombre:</label><br><input type="text" name="nombre" value="{{ miembro.nombre }}" required></p>
    <p><label>Edad:</label><br><input type="number" name="edad" value="{{ miembro.edad }}" required></p>
    <p><label>Plan:</label><br><input type="text" name="plan" value="{{ miembro.plan }}" required></p>
    <button type="submit" class="btn">Actualizar</button>
    <a href="{% url 'listar_miembros' %}">Cancelar</a>
</form>
{% endblock %}
